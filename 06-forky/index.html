<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=., initial-scale=1.0" />
    <link rel="stylesheet" href="./assets/css/reset.css" />
    <link rel="stylesheet" href="./assets/css/index.css" />
    <title>FORKY EN CSS</title>
</head>

<body>

    <div class="layout">

        <main class="layout__container">


            <img src="./assets/img/forky.png" alt="FORKY" title="FORKY" class="layout__img" />

            <div class="layout__forky">

                <section class="forky__hairs">
                    <div class="forky__hair1"></div>
                    <div class="forky__hair2"></div>
                    <div class="forky__hair3"></div>
                    <div class="forky__hair4"></div>
                </section>

                <div class="forky__eyebrow"></div>
                <div class="forky__eyebrow-corner-left"></div>
                <div class="forky__eyebrow-corner-right"></div>

                <section class="forky__eye-left">
                    <div class="eye-left__pupil"></div>
                </section>

                <section class="forky__eye-right">
                    <div class="eye-left__pupil"></div>
                </section>

                <section class="body__mouth">
                    <div class="mouth__lip-top"></div>
                    <div class="mouth__lip-bottom"></div>
                    <div class="mouth__lip-corner-left"></div>
                    <div class="mouth__lip-corner-right"></div>
                </section>

                <section class="forky__stick"></section>
            </div>

        </main>
    </div>

</body>

</html>
